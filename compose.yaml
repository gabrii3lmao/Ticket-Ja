services:
  db:
    image: postgres:15-alpine
    container_name: meu_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin@123
      POSTGRES_DB: ticketmaster

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  cache:
    image: redis:7.4-alpine
    container_name: meu_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass admin@123
    volumes:
      - cache:/data

volumes:
  cache:
    driver: local
  postgres_data:
